name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          ls -la
          if [ ! -f project.zip ]; then
            echo "project.zip is missing"
            exit 1
          fi
